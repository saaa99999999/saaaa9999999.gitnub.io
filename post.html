<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - saaa9999's Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="post-style.css">
    <link rel="stylesheet" href="prism.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="site-logo">
                    <img src="avatar.jpg" alt="saaa9999">
                    <a href="index.html" style="color: inherit; text-decoration: none;"><span>saaa9999</span></a>
                </div>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link">首页</a>
                    <a href="archive.html" class="nav-link">归档</a>
                </nav>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索文章...">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="post-layout">
            <aside class="table-of-contents">
                <div class="toc-header">目录</div>
                <nav id="toc-nav"></nav>
            </aside>
            <article class="post-content">
                <div id="post-detail">
                    <!-- 文章内容将通过 JavaScript 动态加载 -->
                </div>
            </article>
        </div>
        <div class="back-link">
            <a href="index.html">返回首页</a>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 saaa9999. All rights reserved.</p>
        </div>
    </footer>

    <script src="post-script.js"></script>
    <script src="prism.js"></script>
</body>
</html>
