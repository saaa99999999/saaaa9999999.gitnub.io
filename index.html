<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saaa999 的博客</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>saaa999 的博客</h1>
            <p class="subtitle">分享技术与生活</p>
        </div>
    </header>

    <main class="container">
        <div id="posts-container">
            <!-- 文章列表将通过 JavaScript 动态加载 -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 saaa999. All rights reserved.</p>
        </div>
    </footer>

    <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">🌙</button>

    <script src="script.js"></script>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const btn = document.querySelector('.theme-toggle');
            btn.textContent = document.body.classList.contains('light-theme') ? '🌞' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }
        
        // 加载保存的主题
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            document.querySelector('.theme-toggle').textContent = '🌞';
        }
    </script>
</body>
</html>
