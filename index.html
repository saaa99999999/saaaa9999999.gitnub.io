<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saaa9999's Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="site-logo">
                    <img src="avatar.jpg" alt="saaa9999">
                    <span>saaa9999</span>
                </div>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link active">首页</a>
                    <a href="archive.html" class="nav-link">归档</a>
                </nav>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索文章...">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <main class="container main-container">
        <div class="content-wrapper">
            <div class="main-content">
                <div class="hero-section">
                    <div class="clouds">
                        <div class="cloud cloud1"></div>
                        <div class="cloud cloud2"></div>
                        <div class="cloud cloud3"></div>
                        <div class="cloud cloud4"></div>
                        <div class="cloud cloud5"></div>
                    </div>
                    <h1 class="hero-title">saaa9999's Blog</h1>
                    <p class="hero-subtitle">希望永远对 CTF 充满热情</p>
                </div>
                <div id="posts-container">
                    <!-- 文章列表将通过 JavaScript 动态加载 -->
                </div>
                <div id="pagination"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 saaa9999. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
